services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Read POSTGRES_DB/USER/PASSWORD straight from the .env file rather than
    # through docker-compose's own ${VAR} interpolation: some stack managers
    # (e.g. Dockhand) don't perform that interpolation, which silently falls
    # back to the hardcoded defaults below and initializes Postgres with the
    # wrong credentials on first boot - env_file is a plain, universally
    # supported mechanism that sidesteps that entirely.
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ (escaped) so the shell *inside* the container expands its own,
      # correctly-set POSTGRES_USER - not docker-compose at parse time.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  postgres_data:
  media_data:
  static_data:
